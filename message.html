<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>ECARD</title>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;1,9..144,400&family=Figtree:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <video class="bg-video" src="videos/bg.mp4" autoplay muted loop playsinline></video>

    <!-- PAGE 3 of 3: the message -->
    <main class="card wide">
        <div id="game">
            <h1 id="title"></h1>

            <div class="board done" id="board">
                <div class="photo" id="photo"></div>
            </div>

            <div class="tools" id="tools">
                <a class="btn" href="puzzle.html">Play Again</a>
            </div>

            <section class="msg show" id="msg">
                <h2 id="mTitle"></h2>
                <div id="mBody"></div>
                <p class="from" id="mFrom"></p>

                <!-- Reply form (validated with JavaScript + RegEx, Unit VII) -->
                <form id="replyForm" class="reply" novalidate>
                    <h3>Send me a reply, Ma'am 💌</h3>

                    <div class="form-group">
                        <label for="fullname">Full Name</label>
                        <input type="text" id="fullname" placeholder="Enter your full name" autocomplete="name">
                        <span id="nameMsg" class="error-msg" aria-live="polite"></span>
                    </div>

                    <div class="form-group">
                        <label for="email">Email Address</label>
                        <input type="text" id="email" placeholder="Enter your email address" autocomplete="email">
                        <span id="emailMsg" class="error-msg" aria-live="polite"></span>
                    </div>

                    <div class="form-group">
                        <label for="contact">Contact Number</label>
                        <input type="text" id="contact" placeholder="e.g., 09171234567" inputmode="numeric" autocomplete="tel">
                        <span id="contactMsg" class="error-msg" aria-live="polite"></span>
                    </div>

                    <div class="form-group">
                        <label for="reply">Your Reply</label>
                        <textarea id="reply" rows="3" placeholder="Write your reply (at least 10 characters)"></textarea>
                        <span id="replyMsg" class="error-msg" aria-live="polite"></span>
                    </div>

                    <button type="submit" class="btn send-btn">Send Reply</button>
                    <p id="formResult" class="form-result" aria-live="polite"></p>
                </form>
            </section>
        </div>
    </main>

    <script src="card.js"></script>
    <script src="message.js"></script>
</body>
</html>
