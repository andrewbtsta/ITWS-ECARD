<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>ECARD</title>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;1,9..144,400&family=Figtree:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <video class="bg-video" src="videos/bg.mp4" autoplay muted loop playsinline></video>

    <!-- PAGE 1 of 3: the "click me" screen -->
    <main class="card">
        <div class="intro">
            <div class="gift" aria-hidden="true">✉️</div>
            <h1>Hello Ma'am!</h1>
            <p class="sub">Please open it to view the message</p>

            <!-- HTML5 built-in validation (Unit VII): required + pattern + title, no JavaScript -->
            <form class="gate" action="puzzle.html" method="get">
                <label for="secret">Type Roan to proceed</label>
                <input type="text" id="secret" placeholder="Type Here...."
                       required
                       pattern="[Rr][Oo][Aa][Nn]"
                       title="Please type the word Roan (letters only, no spaces)."
                       autocomplete="off">
                <button type="submit" class="click-btn">Click Me</button>
            </form>
        </div>
    </main>
</body>
</html>
